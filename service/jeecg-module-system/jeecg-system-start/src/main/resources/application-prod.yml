server:
  port: 8080
  tomcat:
    max-swallow-size: -1
  error:
    include-exception: true
    include-stacktrace: ALWAYS
    include-message: ALWAYS
  servlet:
    context-path: /jeecg-boot
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges,jeecghttptrace

spring:
  flyway:
    # Whether to enable flyway
    enabled: false
    # Whether to disable cleaning existing tables, MUST be true for production to avoid data loss, VERY IMPORTANT!!!
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # Send email via scheduled task
    timeJobSend: false
    host: smtp.163.com
    username: jeecgos@163.com
    password: ??
    properties:
      mail.smtp.auth: true
      smtp.ssl.enable: true
  ## Quartz scheduled tasks, database mode
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: embedded
    # Scheduled task switch: true-ON, false-OFF
    auto-startup: true
    # Delay 1s to start scheduled task
    startup-delay: 1s
    # Update existing jobs on startup
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            misfireThreshold: 12000
            clusterCheckinInterval: 15000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
  # Unified JSON timestamp conversion
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  # Freemarker configuration
  freemarker:
    # Set template suffix
    suffix: .ftl
    # Set document type
    content-type: text/html
    # Set page encoding
    charset: UTF-8
    # Set page cache
    cache: false
    prefer-file-system-access: false
    # Set ftl file path
    template-loader-path:
      - classpath:/templates
    template_update_delay: 0
  # Set static file paths for js, css, etc.
  mvc:
    static-path-pattern: /**
    # Spring Boot 2.6+ default strategy changed from AntPathMatcher to PathPatternParser, setting to ant-path-matcher manually
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      druid: # Global Druid parameters, mostly consistent with defaults. (Supported parameters below, do not change if unsure)
        # Connection pool configuration
        # Initial size, min, max
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        # Timeout for acquiring a connection
        maxWait: 60000
        # Interval for checking idle connections to close (ms)
        timeBetweenEvictionRunsMillis: 60000
        # Min survival time for a connection in pool (ms)
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # Open PSCache and specify cache size per connection
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # Filters for monitoring, removing them disables SQL monitoring; 'wall' is for firewall
        filters: stat,slf4j
        # Allow SELECT with infinite truth conditions in WHERE clause
        wall:
          selectWhereAlwayTrueCheck: false
        # Enable mergeSql; Slow SQL recording
        stat:
          merge-sql: true
          slow-sql-millis: 5000
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/jeecg-boot?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          # Multi-datasource configuration
          #multi-datasource1:
          #url: jdbc:mysql://localhost:3306/jeecg-boot2?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          #username: root
          #password: root
          #driver-class-name: com.mysql.cj.jdbc.Driver
  # redis configuration
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password:
# MyBatis Plus settings
mybatis-plus:
  mapper-locations: classpath*:org/jeecg/**/xml/*Mapper.xml
  global-config:
    # Disable MyBatis Plus 3.0 built-in banner
    banner: false
    db-config:
      # ID Type: 0: Auto-increment; 1: Unset; 2: Manual; 3: Global Unique ID (Numeric); 4: Global Unique ID (UUID); 5: Global Unique ID (String);
      id-type: ASSIGN_ID
      # Table naming default to underscore
      table-underline: true
  configuration:
    # This configuration prints executed SQL, useful for dev or test
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # When returning Map, include fields with null values
    call-setters-on-nulls: true
# Jeecg specific configuration
minidao:
  base-package: org.jeecg.modules.jmreport.*,org.jeecg.modules.drag.*
jeecg:
  # AI Integration
  ai-chat:
    enabled: true
    model: deepseek-chat
    apiKey: ??
    apiHost: https://api.deepseek.com
    timeout: 60
  # AI Rag vector store
  ai-rag:
    embed-store:
      host: 127.0.0.1
      port: 5432
      database: postgres
      user: postgres
      password: postgres
      table: embeddings
  # Platform security configuration
  firewall:
    # Datasource security (If enabled, Online report/chart datasource is required)
    dataSourceSafe: true
    # Low-code mode (dev: Development, prod: Production - disables all online dev features)
    lowCodeMode: prod
  # Signature secret (must match frontend, change for production)
  signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
  # Signature interception URLs
  signUrls: /sys/dict/getDictItems/*,/sys/dict/loadDict/*,/sys/dict/loadDictOrderByValue/*,/sys/dict/loadDictItem/*,/sys/dict/loadTreeData,/sys/api/queryTableDictItemsByCode,/sys/api/queryFilterTableDictInfo,/sys/api/queryTableDictByKeys,/sys/api/translateDictFromTable,/sys/api/translateDictFromTableByKeys,/sys/sendChangePwdSms,/sys/user/sendChangePhoneSms,/sys/sms,/desform/api/sendVerifyCode
  # local\minio\alioss
  uploadType: alioss
  # Frontend access URL
  domainUrl:
    pc: http://localhost:3100
    app: http://localhost:8051
  path:
    # File upload root directory
    upload: /opt/jeecg-boot/upload
    # Webapp file path
    webapp: /opt/jeecg-boot/webapp
  shiro:
    excludeUrls: /test/jeecgDemo/demo3,/test/jeecgDemo/redisDemo/**,/bigscreen/category/**,/bigscreen/visual/**,/bigscreen/map/**,/jmreport/bigscreen2/**,/api/getUserInfo
  # Alibaba Cloud OSS and SMS credentials
  oss:
    accessKey: ??
    secretKey: ??
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: jeecgdev
    staticDomain: https://static.jeecg.com
    # SMS template
    sms-template:
      # Signature
      signature:
      # Template code
      templateCode:
        # Login/Forgot Password SMS code
        SMS_175435174:
        # Change password SMS code
        SMS_465391221:
        # Register account SMS code
        SMS_175430166:
        SMS_461885023:
  # Online file preview server configuration
  file-view-domain: http://fileview.jeecg.com
  # Minio file upload
  minio:
    minio_url: http://minio.jeecg.com
    minio_name: ??
    minio_pass: ??
    bucketName: otatest
  # BI Report parameters
  jmreport:
    # Multi-tenant mode: null (default), created (by creator), tenant (by tenant) (v1.6.2+ added)
    saasMode:
    # Platform security configuration (v1.6.2+ added)
    firewall:
      # Datasource security (If enabled, platform datasource not allowed, SQL signing required, direct DB query disabled)
      dataSourceSafe: true
      # Low-code mode (dev: Development, prod: Production - disables online report design, except for admin/lowdeveloper)
      lowCodeMode: prod
    # Amap API configuration (v2.1.3+ added for BI)
    gao-de-api:
      # App Key
      api-key: ??
      # App Secret
      secret-key: ??
  # xxl-job configuration
  xxljob:
    enabled: false
    adminAddresses: http://127.0.0.1:9080/xxl-job-admin
    appname: ${spring.application.name}
    accessToken: ''
    address: 127.0.0.1:30007
    ip: 127.0.0.1
    port: 30007
    logPath: logs/jeecg/job/jobhandler/
    logRetentionDays: 30
  # Distributed lock configuration
  redisson:
    address: 127.0.0.1:6379
    password:
    type: STANDALONE
    enabled: true
  # Baidu Open API configuration
  baidu-api:
    app-id: ??
    api-key: ??
    secret-key: ??
# CAS SSO
cas:
  prefixUrl: http://cas.example.org:8443/cas
# MyBatis SQL log output
logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: error
    org.flywaydb: debug
    org.jeecg.modules.system.mapper: info
# swagger
knife4j:
  # Enable enhanced configuration
  enable: true
  # Enable production shield
  production: true
  basic:
    enable: true
    username: jeecg
    password: jeecg1314
# Third-party login
justauth:
